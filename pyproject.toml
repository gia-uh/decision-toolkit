[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-toolkit"
version = "0.1.3"
description = "Local-first toolkit for open-weights decision models: one ONNX engine, one adapter per model contract, typed choice/yes-no/score decisions with probabilities on CPU."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yudivián Almeida Cruz", email = "yudivian@gmail.com" },
    { name = "Syalia S.R.L." },
]
keywords = [
    "decision-models",
    "system-one",
    "jev",
    "onnx",
    "local-first",
    "cpu",
    "classification",
    "routing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "huggingface_hub>=0.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
tracing = [
    "opentelemetry-api>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "openai>=1.0",
    "pip-audit>=2",
    "twine>=5",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/gia-uh/decision-toolkit"
Repository = "https://github.com/gia-uh/decision-toolkit"
Issues = "https://github.com/gia-uh/decision-toolkit/issues"
Documentation = "https://uhgia.org/decision-toolkit/"
Changelog = "https://github.com/gia-uh/decision-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
dtk = "decision_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_toolkit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/decision_toolkit",
    "/docs",
    "/bench",
    "/tests",
    "/.github",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/THIRD_PARTY_NOTICES.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.uv]
required-version = ">=0.11"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load a real model (slow; opt-in with `-m integration`)",
    "fuzz: deterministic malformed-input corpus for the REST boundary",
]
addopts = "-m 'not integration'"
