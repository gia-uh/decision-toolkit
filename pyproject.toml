[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-toolkit"
version = "0.0.1"
description = "Local-first toolkit for open-weights decision models: typed choice/yes-no/score decisions with probabilities, on CPU. Library-first, with CLI and REST interfaces."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yudivián Almeida Cruz", email = "yudivian@gmail.com" },
]
keywords = [
    "decision-models",
    "system-one",
    "jev",
    "local-first",
    "cpu",
    "classification",
    "routing",
    "llm",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "huggingface_hub>=0.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
laya = [
    "laya>=0.3.23",
]
von = [
    "von-sdk",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
dtk = "decision_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load a real model (slow; opt-in with `-m integration`)",
]
addopts = "-m 'not integration'"
