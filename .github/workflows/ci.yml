name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest ruff PyYAML huggingface_hub fastapi httpx pydantic numpy openai
      - name: Lint
        run: ruff check src tests bench
      - name: Unit and contract tests (source tree, no wheel)
        run: pytest -q
      - name: CLI smoke from source
        run: |
          python -m decision_toolkit --version
          python -m decision_toolkit --home "$RUNNER_TEMP/dtk-home" doctor --json

  package:
    name: wheel build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/dtk-wheel
          /tmp/dtk-wheel/bin/pip install --upgrade pip
          /tmp/dtk-wheel/bin/pip install dist/*.whl
          /tmp/dtk-wheel/bin/pip check
          /tmp/dtk-wheel/bin/dtk --version
          /tmp/dtk-wheel/bin/dtk models list --json

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install audit tool and runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install PyYAML huggingface_hub fastapi httpx pydantic numpy
      - name: pip-audit
        run: pip-audit
