name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run --no-sync ruff check src tests bench
      - name: Unit and contract tests (source tree, no wheel)
        run: uv run --no-sync pytest -q
      - name: CLI smoke from source
        run: |
          uv run --no-sync dtk --version
          uv run --no-sync dtk --home "$RUNNER_TEMP/dtk-home" doctor --json

  package:
    name: wheel build and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Build and validate distributions with uv
        run: |
          uv build
          uv run --no-sync twine check dist/*
      - name: Install the wheel in a clean uv venv
        run: |
          uv venv --python 3.12 /tmp/dtk-wheel
          uv pip install --python /tmp/dtk-wheel/bin/python dist/*.whl
          uv pip check --python /tmp/dtk-wheel/bin/python
          /tmp/dtk-wheel/bin/dtk --version
          /tmp/dtk-wheel/bin/dtk models list --json

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - name: pip-audit
        run: uv run --no-sync pip-audit
