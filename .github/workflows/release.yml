name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (tag pushes always publish TestPyPI then PyPI)"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    name: publish TestPyPI
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: verify TestPyPI install
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'testpypi'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print("VERSION=" + tomllib.load(handle)["project"]["version"])
          PY
      - name: Install from TestPyPI and smoke test
        run: |
          python -m venv /tmp/dtk-testpypi
          /tmp/dtk-testpypi/bin/pip install --upgrade pip
          /tmp/dtk-testpypi/bin/pip install             --index-url https://test.pypi.org/simple/             --extra-index-url https://pypi.org/simple             "decision-toolkit==$VERSION"
          /tmp/dtk-testpypi/bin/pip check
          /tmp/dtk-testpypi/bin/dtk --version
          /tmp/dtk-testpypi/bin/dtk models list --json

  publish-pypi:
    name: publish PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: verify PyPI install
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print("VERSION=" + tomllib.load(handle)["project"]["version"])
          PY
      - name: Install from PyPI and smoke test
        run: |
          python -m venv /tmp/dtk-pypi
          /tmp/dtk-pypi/bin/pip install --upgrade pip
          /tmp/dtk-pypi/bin/pip install "decision-toolkit==$VERSION"
          /tmp/dtk-pypi/bin/pip check
          /tmp/dtk-pypi/bin/dtk --version
          /tmp/dtk-pypi/bin/dtk models list --json

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
