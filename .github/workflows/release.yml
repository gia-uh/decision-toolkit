name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (tag pushes always publish TestPyPI then PyPI)"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Build sdist and wheel with uv
        run: |
          uv sync --frozen
          uv build
          uv run --no-sync twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    name: publish TestPyPI
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: verify TestPyPI install
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'testpypi'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Resolve version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print("VERSION=" + tomllib.load(handle)["project"]["version"])
          PY
      - name: Resolve published TestPyPI wheel
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, time, urllib.request
          version = os.environ["VERSION"]
          url = f"https://test.pypi.org/pypi/decision-toolkit/{version}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  if data["info"]["version"] != version:
                      raise RuntimeError("published version mismatch")
                  wheel = next(
                      item["url"] for item in data["urls"]
                      if item["filename"].endswith(".whl")
                  )
                  print("WHEEL_URL=" + wheel)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
      - name: Install from TestPyPI with uv and smoke test
        run: |
          uv venv --python 3.12 /tmp/dtk-testpypi
          uv pip install --python /tmp/dtk-testpypi/bin/python "$WHEEL_URL"
          uv pip check --python /tmp/dtk-testpypi/bin/python
          /tmp/dtk-testpypi/bin/dtk --version
          /tmp/dtk-testpypi/bin/dtk models list --json

  publish-pypi:
    name: publish PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: verify PyPI install
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Resolve version
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print("VERSION=" + tomllib.load(handle)["project"]["version"])
          PY
      - name: Resolve published PyPI wheel
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, time, urllib.request
          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/decision-toolkit/{version}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  if data["info"]["version"] != version:
                      raise RuntimeError("published version mismatch")
                  wheel = next(
                      item["url"] for item in data["urls"]
                      if item["filename"].endswith(".whl")
                  )
                  print("WHEEL_URL=" + wheel)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
      - name: Install from PyPI with uv and smoke test
        run: |
          uv venv --python 3.12 /tmp/dtk-pypi
          uv pip install --python /tmp/dtk-pypi/bin/python "$WHEEL_URL"
          uv pip check --python /tmp/dtk-pypi/bin/python
          /tmp/dtk-pypi/bin/dtk --version
          /tmp/dtk-pypi/bin/dtk models list --json

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
