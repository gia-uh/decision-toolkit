site_name: decision-toolkit
site_description: Local-first toolkit for open-weights decision models on CPU.
site_url: https://gia-uh.github.io/decision-toolkit/
repo_url: https://github.com/gia-uh/decision-toolkit
repo_name: gia-uh/decision-toolkit
edit_uri: edit/main/docs/
copyright: MIT — GIA-UH and Syalia S.R.L.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Installation: INSTALLATION.md
  - Examples: EXAMPLES.md
  - Recipes: RECIPES.md
  - Models:
      - Models and the cache: MODELS.md
      - Variants and quantization: VARIANTS.md
      - Model cards: models/README.md
      - GLiNER2.5 multi: models/gliner2.5-multi.md
      - GLiNER2.5-Decide: models/gliner2.5-decide.md
      - Laya: models/laya.md
      - Julia 1: models/julia-1.md
      - OpenDecider nano: models/opendecider-nano.md
      - Laya multilingual: models/laya-multilingual.md
      - Open-Jev DeBERTa v3 large: models/open-jev-deberta-v3-large.md
      - Strands Decider 2B: models/strands-decider-2b.md
  - Library guide: LIBRARY.md
  - Core API: CORE.md
  - CLI: CLI.md
  - REST: REST.md
  - Operations: OPERATIONS.md
  - Benchmarks: BENCH.md
  - Troubleshooting: TROUBLESHOOTING.md
  - FAQ: FAQ.md
  - Glossary: GLOSSARY.md
  - Release: RELEASE.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  links:
    absolute_links: relative_to_docs
